name: Cron · Seller stock reminders

# Runs once a day via GitHub Actions cron — replaces the Vercel cron config.
# 19:00 UTC = 20:00 WAT (Lagos time), which is when sellers are likely to
# be wrapping up before tomorrow.
#
# `workflow_dispatch` lets you fire it manually from the Actions tab.
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the reminders endpoint
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -X GET \
            --max-time 300 \
            "${{ secrets.CRON_BASE_URL }}/api/cron/seller-stock-reminders" \
            -w "\nHTTP %{http_code} in %{time_total}s\n"
