# Render.com deploy spec — Web Service backed by the host-neutral Dockerfile.
#
# Usage:
#   1. Push the repo to GitHub.
#   2. On render.com: New + → Blueprint → point at the repo.
#   3. Render reads this file, creates the service, prompts you to fill in
#      the env vars marked sync: false (i.e. secrets).
#   4. First build runs the Dockerfile; subsequent pushes auto-deploy.
#
# Database: Render's free tier has NO persistent disk for web services and
# its managed Postgres free tier expires after 90 days. We keep the DB on
# Turso (libSQL) — set TURSO_DATABASE_URL + TURSO_AUTH_TOKEN below.

services:
  - type: web
    name: streekmart
    runtime: docker
    plan: free        # 512 MB RAM, 0.1 CPU — cold-starts after 15 min idle.
    region: oregon    # Match the closest Turso region (or change to frankfurt / singapore).
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /api/health

    # Render injects PORT — entrypoint.sh already reads it.
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: FEATURE_SKETCH_3D
        value: "1"
      - key: MONNIFY_LIVE
        value: "0"
      - key: MONNIFY_BASE_URL
        value: https://sandbox.monnify.com
      # NEXT_PUBLIC_APP_URL is set to the Render-assigned hostname after
      # the service is created. Update it from the dashboard.
      - key: NEXT_PUBLIC_APP_URL
        sync: false

      # ----- Secrets (paste in the Render dashboard) -----
      - key: JWT_SECRET
        generateValue: true     # Render mints a 32-char value on first deploy.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MONNIFY_API_KEY
        sync: false
      - key: MONNIFY_SECRET_KEY
        sync: false
      - key: MONNIFY_CONTRACT_CODE
        sync: false
      - key: MONNIFY_WALLET_ID
        sync: false
      - key: MONNIFY_WEBHOOK_HASH
        sync: false
